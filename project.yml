# XcodeGen spec — run `xcodegen generate` (or `make xcode`) to create Focus.xcodeproj.
name: Focus
options:
  bundleIdPrefix: dev.focusview
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  FocusCore:
    type: framework
    platform: macOS
    sources: [Sources/FocusCore]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.focusview.FocusCore
  Focus:
    type: application
    platform: macOS
    sources: [Sources/Focus]
    dependencies:
      - target: FocusCore
    settings:
      base:
        PRODUCT_NAME: Focus
        PRODUCT_BUNDLE_IDENTIFIER: dev.focusview.Focus
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/Focus.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  FocusCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FocusCoreTests]
    dependencies:
      - target: FocusCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Focus:
    build:
      targets:
        Focus: all
        FocusCoreTests: [test]
    test:
      targets: [FocusCoreTests]
