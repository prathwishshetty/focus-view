<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Focus app icon: a split view of three panes, one of them in focus.
       Laid out on the macOS icon grid (824pt body, 100pt margin). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3340"/>
      <stop offset="1" stop-color="#111319"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6CC0FF"/>
      <stop offset="1" stop-color="#2B63F6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>

  <g clip-path="url(#squircle)">
    <!-- Light from the focused pane spilling onto the body. -->
    <rect x="236" y="236" width="282" height="552" rx="48" fill="#3B82F6" opacity="0.55" filter="url(#glow)"/>

    <!-- The resting panes. -->
    <rect x="558" y="236" width="230" height="256" rx="48" fill="url(#pane)"/>
    <rect x="558" y="532" width="230" height="256" rx="48" fill="url(#pane)"/>
    <rect x="558.75" y="236.75" width="228.5" height="254.5" rx="47.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
    <rect x="558.75" y="532.75" width="228.5" height="254.5" rx="47.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- The focused pane. -->
    <rect x="236" y="236" width="282" height="552" rx="48" fill="url(#focus)"/>
    <rect x="236" y="236" width="282" height="552" rx="48" fill="url(#sheen)"/>
    <rect x="237" y="237" width="280" height="550" rx="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- A hairline rim to lift the body off dark backgrounds. -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
